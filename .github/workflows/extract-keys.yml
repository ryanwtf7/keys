name: Extract Encryption Keys

on:
  # Run on schedule (daily at 00:00 UTC)
  schedule:
    - cron: '0 0 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Run on push to master (optional)
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - '.github/workflows/**'

jobs:
  extract-keys:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow the workflow to push commits
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔨 Build TypeScript
        run: npm run build
      
      - name: 🔑 Extract keys from endpoints
        env:
          # Using encrypted keys from source code (no env var needed)
          # Keys will be auto-decrypted at runtime
          NODE_ENV: production
        run: |
          echo "🚀 Starting key extraction..."
          npm run update || echo "⚠️ Some endpoints may have failed due to rate limits"
      
      - name: 📊 Verify extracted keys
        run: |
          echo "📋 Checking extracted keys..."
          echo ""
          if [ -f "megacloud_v2.txt" ]; then
            echo "✅ MegaCloud V2: $(wc -c < megacloud_v2.txt) bytes"
          else
            echo "❌ MegaCloud V2: Not found"
          fi
          
          if [ -f "megacloud_v3.txt" ]; then
            echo "✅ MegaCloud V3: $(wc -c < megacloud_v3.txt) bytes"
          else
            echo "❌ MegaCloud V3: Not found"
          fi
          
          if [ -f "cloudvidz_v2.txt" ]; then
            echo "✅ CloudVidz V2: $(wc -c < cloudvidz_v2.txt) bytes"
          else
            echo "❌ CloudVidz V2: Not found"
          fi
          
          if [ -f "cloudvidz_v3.txt" ]; then
            echo "✅ CloudVidz V3: $(wc -c < cloudvidz_v3.txt) bytes"
          else
            echo "❌ CloudVidz V3: Not found"
          fi
          
          if [ -f "rapidcloud_v2.txt" ]; then
            echo "✅ RapidCloud V2: $(wc -c < rapidcloud_v2.txt) bytes"
          else
            echo "❌ RapidCloud V2: Not found"
          fi
      
      - name: 📤 Upload extracted keys as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extracted-keys-${{ github.run_number }}
          path: |
            megacloud_v2.txt
            megacloud_v3.txt
            cloudvidz_v2.txt
            cloudvidz_v3.txt
            rapidcloud_v2.txt
          retention-days: 7
      
      - name: 🔄 Commit updated keys (if changed)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add key files if they exist
          git add -f *.txt 2>/dev/null || true
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "📝 No changes to commit"
          else
            git commit -m "chore: Update extracted keys [skip ci]" \
                       -m "🔑 Auto-updated encryption keys from endpoints" \
                       -m "🤖 Generated by GitHub Actions" \
                       -m "📅 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            
            git push
            echo "✅ Changes committed and pushed"
          fi
      
      - name: 📊 Job Summary
        if: always()
        run: |
          echo "## 🔑 Key Extraction Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | Status | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|------|" >> $GITHUB_STEP_SUMMARY
          
          for file in megacloud_v2.txt megacloud_v3.txt cloudvidz_v2.txt cloudvidz_v3.txt rapidcloud_v2.txt; do
            endpoint=$(echo $file | sed 's/.txt//' | sed 's/_/ /g' | awk '{for(i=1;i<=NF;i++){ $i=toupper(substr($i,1,1)) substr($i,2) }}1')
            if [ -f "$file" ]; then
              size=$(wc -c < $file)
              echo "| $endpoint | ✅ Success | $size bytes |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $endpoint | ❌ Failed | - |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔐 **All API keys are encrypted in the source code**" >> $GITHUB_STEP_SUMMARY
          echo "🚀 **Workflow completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')**" >> $GITHUB_STEP_SUMMARY
